[package]
name = "Game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["free_camera"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-utils = 1
lto = "thin"

[prfile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"